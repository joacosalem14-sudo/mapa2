<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catastro CABA</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; }
#app { display: flex; height: 100dvh; }
#panel {
  width: 280px; min-width: 280px; background: #f8f9fa;
  border-right: 1px solid #dee2e6; padding: 10px;
  overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
}
#map { flex: 1; }
h2 { font-size: 13px; color: #333; border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-bottom: 2px; }
.filter-group { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 8px; }
.filter-group h3 { font-size: 11px; color: #555; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; letter-spacing: .3px; }
.cb-list { max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.cb-list label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12px; color: #333; padding: 3px 0; }
.cb-list input[type=checkbox] { width: 20px; height: 20px; flex-shrink: 0; cursor: pointer; }
.range-row { display: flex; gap: 5px; align-items: center; }
.range-row input { flex: 1; padding: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; min-width: 0; }
.range-row span { font-size: 11px; color: #aaa; flex-shrink: 0; }
.sel-link { font-size: 10px; color: #0066cc; cursor: pointer; text-decoration: underline; font-weight: normal; margin-left: 4px; }
#btn-filtrar {
  background: #0066cc; color: white; border: none; border-radius: 6px;
  padding: 10px; font-size: 13px; cursor: pointer; width: 100%; font-weight: bold;
}
#btn-filtrar:active { background: #0055aa; }
#btn-limpiar {
  background: white; color: #888; border: 1px solid #ddd; border-radius: 6px;
  padding: 6px; font-size: 11px; cursor: pointer; width: 100%;
}
#status { font-size: 11px; color: #666; text-align: center; min-height: 16px; }
.popup-table { border-collapse: collapse; font-size: 12px; min-width: 220px; }
.popup-table tr:nth-child(even) { background: #f9f9f9; }
.popup-table td { padding: 3px 7px; }
.popup-table td:first-child { color: #888; white-space: nowrap; }
.popup-table td:last-child { font-weight: 500; }
@media (max-width: 600px) {
  #app { flex-direction: column; }
  #panel { width: 100%; min-width: unset; max-height: 45dvh; border-right: none; border-bottom: 1px solid #dee2e6; }
  #map { flex: 1; min-height: 0; }
}
#sugerencias {
  position: fixed; z-index: 9999; background: white;
  border: 1px solid #ccc; border-radius: 4px;
  box-shadow: 0 4px 12px rgba(0,0,0,.15); display: none; max-height: 220px; overflow-y: auto;
}
.sugerencia {
  padding: 7px 10px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #f0f0f0;
}
.sugerencia:hover { background: #f0f6ff; }
.sugerencia span { color: #888; font-size: 11px; margin-left: 5px; }
#buscar-dir { width:100%; padding:6px; border:1px solid #ccc; border-radius:4px; font-size:14px; box-sizing:border-box; }
</style>
</head>
<body>
<div id="app">
<div id="panel">
  <h2>Catastro CABA <span id="ver"></span></h2>

  <div class="filter-group" style="position:relative">
    <h3>Buscar dirección</h3>
    <input type="text" id="buscar-dir" placeholder="Ej: Arcos 1860"
           oninput="debounceBuscar(this.value)"
           onkeydown="if(event.key==='Escape')hideSugerencias()"
           autocomplete="off">
  </div>

  <div class="filter-group">
    <h3>Barrio <span class="sel-link" onclick="toggleAll('cb-barrio',true)">todos</span> <span class="sel-link" onclick="toggleAll('cb-barrio',false)">ninguno</span></h3>
    <div class="cb-list" id="lista-barrios"></div>
  </div>

  <div class="filter-group">
    <h3>Zonificación <span class="sel-link" onclick="toggleAll('cb-tipo',true)">todas</span> <span class="sel-link" onclick="toggleAll('cb-tipo',false)">ninguna</span></h3>
    <div class="cb-list" id="lista-tipos"></div>

  <div class="filter-group">
    <h3>Unidades funcionales <span class="sel-link" onclick="toggleAll('cb-uf',true)">todas</span> <span class="sel-link" onclick="toggleAll('cb-uf',false)">ninguna</span></h3>
    <div class="cb-list" id="lista-ufs"></div>
  </div>
  </div>

  <div class="filter-group">
    <h3>Frente (m)</h3>
    <div class="range-row">
      <input type="number" id="frente-min" placeholder="Desde" min="0" inputmode="decimal">
      <span>—</span>
      <input type="number" id="frente-max" placeholder="Hasta" min="0" inputmode="decimal">
    </div>
  </div>

  <div class="filter-group">
    <h3>Fondo (m)</h3>
    <div class="range-row">
      <input type="number" id="fondo-min" placeholder="Desde" min="0" inputmode="decimal">
      <span>—</span>
      <input type="number" id="fondo-max" placeholder="Hasta" min="0" inputmode="decimal">
    </div>
  </div>

  <div class="filter-group">
    <h3>Altura máx. (m)</h3>
    <div class="range-row">
      <input type="number" id="altura-min" placeholder="Desde" min="0" inputmode="decimal">
      <span>—</span>
      <input type="number" id="altura-max" placeholder="Hasta" min="0" inputmode="decimal">
    </div>
  </div>

  <button id="btn-filtrar" onclick="aplicarFiltros()">Aplicar filtros</button>
  <button id="btn-limpiar" onclick="limpiarFiltros()">Limpiar</button>
  <div id="status"></div>
</div>
<div id="map"></div>
</div>
<div id="sugerencias"></div>

<script>
const BARRIOS = ["AGRONOMIA", "ALMAGRO", "BALVANERA", "BARRACAS", "BELGRANO", "BOCA", "BOEDO", "CABALLITO", "CHACARITA", "COGHLAN", "COLEGIALES", "CONSTITUCION", "FLORES", "FLORESTA", "LINIERS", "MATADEROS", "MONSERRAT", "MONTE CASTRO", "NUEVA POMPEYA", "NÚÑEZ", "PALERMO", "PARQUE AVELLANEDA", "PARQUE CHACABUCO", "PARQUE CHAS", "PARQUE PATRICIOS", "PATERNAL", "PUERTO MADERO", "RECOLETA", "RETIRO", "SAAVEDRA", "SAN CRISTOBAL", "SAN NICOLAS", "SAN TELMO", "VELEZ SARSFIELD", "VERSALLES", "VILLA CRESPO", "VILLA DEL PARQUE", "VILLA DEVOTO", "VILLA GRAL. MITRE", "VILLA LUGANO", "VILLA LURO", "VILLA ORTUZAR", "VILLA PUEYRREDON", "VILLA REAL", "VILLA RIACHUELO", "VILLA SANTA RITA", "VILLA SOLDATI", "VILLA URQUIZA"];
const TIPOS   = ["ND", "CA", "CA / CM", "CA / USAA", "CA / USAM", "CM", "CM / CA", "CM / USAA", "CM / USAM", "U 1", "U 10", "U 11", "U 12", "U 13", "U 15", "U 17", "U 19", "U 2", "U 20", "U 21", "U 22", "U 23", "U 26", "U 28", "U 3", "U 31", "U 32", "U 33", "U 34", "U 35", "U 36", "U 38", "U 39", "U 4", "U 40", "U 41", "U 42", "U 43", "U 44", "U 45", "U 5", "U 50", "U 51", "U 52", "U 53", "U 54", "U 56", "U 57", "U 58", "U 59", "U 6", "U 60", "U 61", "U 63", "U 64", "U 65", "U 66", "U 67", "U 69", "U 71", "U 74", "U 75", "U 76", "U 79", "U 8", "U 81", "U 82", "U 83", "U 84", "U 85", "U 88", "U 89", "U 9", "U 92", "U8", "UF", "UP", "UP/APH 2", "USAA", "USAA / CA", "USAA / CM", "USAA / USAB1", "USAA / USAB2", "USAA / USAM", "USAB1", "USAB1 / USAA", "USAB1 / USAB2", "USAB1 / USAM", "USAB2", "USAB2 / CA", "USAB2 / USAA", "USAB2 / USAB1", "USAB2 / USAM", "USAM", "USAM / CM", "USAM / USAA", "USAM / USAB1", "USAM / USAB2"];
const UFS     = [0, 2, 3];

const listaBarrios = document.getElementById('lista-barrios');
BARRIOS.forEach(b => {
  listaBarrios.innerHTML += `<label><input type="checkbox" class="cb-barrio" value="${b}"> ${b}</label>`;
});
const listaTipos = document.getElementById('lista-tipos');
TIPOS.forEach(t => {
  listaTipos.innerHTML += `<label><input type="checkbox" class="cb-tipo" value="${t}" checked> ${t === 'ND' ? 'SIN IDENTIFICAR' : t}</label>`;
});
const listaUfs = document.getElementById('lista-ufs');
UFS.forEach(u => {
  listaUfs.innerHTML += `<label><input type="checkbox" class="cb-uf" value="${u}" checked> ${u} UF</label>`;
});


const map = L.map('map').setView([-34.615, -58.44], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 19
}).addTo(map);

let capa = null;
let capaPoligono = null;
const correctedPos = JSON.parse(localStorage.getItem('catastro_pos') || '{}');
const cache = {};

function toggleAll(cls, val) {
  document.querySelectorAll('.' + cls).forEach(cb => cb.checked = val);
}
function getChecked(cls) {
  return [...document.querySelectorAll('.' + cls + ':checked')].map(cb => cb.value);
}
function nd(v) { return (v === null || v === undefined || v === '') ? 'ND' : v; }
function setStatus(msg) { document.getElementById('status').textContent = msg; }

function geomCentroid(geom) {
  const ring = geom.type === "Polygon" ? geom.coordinates[0]
             : geom.type === "MultiPolygon" ? geom.coordinates[0][0] : null;
  if (!ring) return null;
  const n = ring.length - 1;
  const s = ring.slice(0, n).reduce((a, c) => [a[0]+c[0], a[1]+c[1]], [0, 0]);
  return [s[1]/n, s[0]/n];
}

function dibujarPoligono(smp, marker) {
  if (capaPoligono) { map.removeLayer(capaPoligono); capaPoligono = null; }
  if (!smp) return;
  fetch(`https://epok.buenosaires.gob.ar/catastro/geometria/?smp=${encodeURIComponent(smp)}`)
    .then(r => r.json())
    .then(data => {
      const geom = (data.features && data.features[0] && data.features[0].geometry) || data.geometry || data.geometria;
      console.log('EPOK data:', JSON.stringify(data).slice(0,200));
      if (!geom || !geom.type) { console.warn('geom invalido:', geom); return; }
      capaPoligono = L.geoJSON(geom, { style: { color: '#e91e8c', weight: 2.5, fillColor: '#e91e8c', fillOpacity: 0.15 } }).addTo(map);
      const c = geomCentroid(geom);
      if (c && marker) {
        marker.setLatLng(c);
        if (smp) { correctedPos[smp] = c; localStorage.setItem('catastro_pos', JSON.stringify(correctedPos)); }
      }
    })
    .catch(err => console.error('EPOK error:', err));
}

function mkPopup(r, barrio) {
  const [lat, lon, dir, pda, frente, fondo, tipo, altMax, _n, _u, smp] = r;
  const fotoUrl = `https://fotos.usig.buenosaires.gob.ar/getFoto?smp=${(smp||'')}&i=0&w=280&h=180`;
  const fotoHtml = smp ? `<img src="${fotoUrl}" style="width:100%;border-radius:4px;margin-bottom:5px;display:block" onerror="this.style.display='none'">` : '';
  return `${fotoHtml}<table class="popup-table">
    <tr><td>Dirección / Barrio</td><td><b>${nd(dir)} / ${barrio}</b></td></tr>
    <tr><td>Partida Matriz</td><td>${nd(pda)}</td></tr>
    <tr><td>Frente / Fondo</td><td>${nd(frente)} m / ${nd(fondo)} m</td></tr>
    <tr><td>Altura Máx.</td><td>${nd(altMax)}</td></tr>
    <tr><td>Zonificación</td><td>${nd(tipo)}</td></tr>
  </table>`;
}


let indice = null;
let buscarTimer = null;

function normalizar(s) {
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
}

async function loadIndice() {
  if (indice) return indice;
  const r = await fetch('datos/indice.json');
  indice = await r.json();
  return indice;
}

function debounceBuscar(q) {
  clearTimeout(buscarTimer);
  if (q.length < 3) { hideSugerencias(); return; }
  buscarTimer = setTimeout(() => buscarDireccion(q), 250);
}

async function buscarDireccion(q) {
  const idx = await loadIndice();
  const qn = normalizar(q);
  const res = idx.filter(r => normalizar(r[0]).startsWith(qn))
               .concat(idx.filter(r => !normalizar(r[0]).startsWith(qn) && normalizar(r[0]).includes(qn)))
               .slice(0, 8);
  if (!res.length) { hideSugerencias(); return; }
  const input = document.getElementById('buscar-dir');
  const rect = input.getBoundingClientRect();
  const list = document.getElementById('sugerencias');
  list.style.left  = rect.left + 'px';
  list.style.top   = (rect.bottom + 2) + 'px';
  list.style.width = rect.width + 'px';
  list.innerHTML = res.map(r =>
    `<div class="sugerencia" onclick="irA('${r[0]}','${r[1]}',
      ${r[2]},${r[3]},'${r[4]}')">
      ${r[0]} <span>${r[1]}</span></div>`
  ).join('');
  list.style.display = 'block';
}

function hideSugerencias() {
  document.getElementById('sugerencias').style.display = 'none';
}

async function irA(dir, barrio, lat, lon, smp) {
  hideSugerencias();
  document.getElementById('buscar-dir').value = dir;
  const cb = document.querySelector(`.cb-barrio[value="${barrio}"]`);
  if (cb && !cb.checked) cb.checked = true;
  await aplicarFiltros(true);
  if (capa) {
    const target = capa.getLayers().find(m => m._smp === smp);
    if (target) { map.setView(target.getLatLng(), 18); target.openPopup(); }
  }
}

document.addEventListener('click', e => {
  if (!e.target.closest('#buscar-dir') && !e.target.closest('#sugerencias'))
    hideSugerencias();
});

async function cargarBarrio(barrio) {
  if (cache[barrio]) return cache[barrio];
  const r = await fetch(`datos/${encodeURIComponent(barrio)}.json`);
  const data = await r.json();
  cache[barrio] = data;
  return data;
}

async function aplicarFiltros(skipFitBounds=false) {
  const barrios   = getChecked('cb-barrio');
  const tipos     = new Set(getChecked('cb-tipo'));
  const ufs      = new Set(getChecked('cb-uf').map(Number));
  const frenteMin = parseFloat(document.getElementById('frente-min').value);
  const frenteMax = parseFloat(document.getElementById('frente-max').value);
  const fondoMin  = parseFloat(document.getElementById('fondo-min').value);
  const fondoMax  = parseFloat(document.getElementById('fondo-max').value);
  const alturaMin = parseFloat(document.getElementById('altura-min').value);
  const alturaMax = parseFloat(document.getElementById('altura-max').value);
  const hayAltura = !isNaN(alturaMin) || !isNaN(alturaMax);

  if (!barrios.length) { setStatus('Seleccioná al menos un barrio.'); return; }

  if (capa) { map.removeLayer(capa); capa = null; }
  if (capaPoligono) { map.removeLayer(capaPoligono); capaPoligono = null; }
  setStatus('Cargando...');
  document.getElementById('btn-filtrar').disabled = true;

  try {
    const todosMarkers = [];
    for (const barrio of barrios) {
      const rows = await cargarBarrio(barrio);
      rows.forEach(r => {
        const [lat, lon, dir, pda, frente, fondo, tipo, altMax, altMaxNum, uf, smp] = r;
        if (lat === null || lon === null || lat > -34.2 || lat < -34.8 || lon > -58.1 || lon < -58.7) return;
        if (!tipos.has(tipo ?? 'ND')) return;
        if (!ufs.has(uf)) return;
        if (!isNaN(frenteMin) && (frente === null || frente < frenteMin)) return;
        if (!isNaN(frenteMax) && (frente === null || frente > frenteMax)) return;
        if (!isNaN(fondoMin)  && (fondo  === null || fondo  < fondoMin))  return;
        if (!isNaN(fondoMax)  && (fondo  === null || fondo  > fondoMax))  return;
        if (hayAltura) {
          if (altMaxNum === null) return;
          if (!isNaN(alturaMin) && altMaxNum < alturaMin) return;
          if (!isNaN(alturaMax) && altMaxNum > alturaMax) return;
        }
        const pos = (smp && correctedPos[smp]) ? correctedPos[smp] : [lat, lon];
        const m = L.circleMarker(pos, {
            radius: 5, color: '#c0392b', weight: 1,
            fillColor: '#e74c3c', fillOpacity: 0.7
          }).bindPopup(mkPopup(r, barrio), {maxWidth: 280}).on('click', (e) => dibujarPoligono(smp, e.target));
        m._smp = smp;
        todosMarkers.push(m);
      });
    }

    if (!todosMarkers.length) { setStatus('Sin resultados.'); return; }
    capa = L.layerGroup(todosMarkers).addTo(map);
    if (!skipFitBounds) map.fitBounds(L.latLngBounds(todosMarkers.map(m => m.getLatLng())), {padding: [20, 20]});
    setStatus(todosMarkers.length.toLocaleString() + ' parcelas');
  } catch(e) {
    setStatus('Error al cargar datos.');
    console.error(e);
  } finally {
    document.getElementById('btn-filtrar').disabled = false;
  }
}

function limpiarFiltros() {
  document.querySelectorAll('.cb-barrio').forEach(cb => cb.checked = false);
  document.querySelectorAll('.cb-tipo').forEach(cb => cb.checked = true);
  document.querySelectorAll('.cb-uf').forEach(cb => cb.checked = true);
  ['frente-min','frente-max','fondo-min','fondo-max','altura-min','altura-max']
    .forEach(id => document.getElementById(id).value = '');
  if (capa) { map.removeLayer(capa); capa = null; }
  setStatus('');
}
document.getElementById("ver").textContent = "v2026-05-06 12:13";
</script>
</body>
</html>
